<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Warehouse, Drawn</title>
  <meta name="description" content="A hand-inked field manual for data warehousing and NetSuite Analytics Warehouse.">
  <script>
    // No flash: set the theme before first paint. Dark is the default; light is the alternate.
    (function () {
      var t = null;
      try { t = localStorage.getItem('drawn-theme'); } catch (e) {}
      document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gelasio:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&family=Caveat:wght@500&display=swap" rel="stylesheet">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/site/main.tsx"></script>
</body>
</html>
