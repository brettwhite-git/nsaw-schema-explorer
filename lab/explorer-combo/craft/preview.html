<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Craft accents</title>
  <link rel="icon" href="data:,">
  <link href="https://fonts.googleapis.com/css2?family=Gelasio:ital,wght@0,400;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root { --dark: #101F26; --dark-2: #172B34; --dark-ink: #E8E4DA; --light: #F6F5F0; --light-ink: #12303D; --accent: #F6AE4E; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--dark); color: var(--dark-ink); font: 14px/1.5 Gelasio, Georgia, serif; }
    .wrap { display: grid; grid-template-columns: 1fr 1fr; min-height: 100vh; }
    .pane { padding: 28px 32px; }
    .pane.light { background: var(--light); color: var(--light-ink); --accent: #A85A00; }
    h2 { font: 500 11px/1 "JetBrains Mono", monospace; letter-spacing: .14em; text-transform: uppercase; opacity: .7; margin: 22px 0 10px; }
    h2:first-child { margin-top: 0; }
    .glyphs { display: grid; grid-template-columns: 64px repeat(9, 1fr); align-items: center; row-gap: 10px; }
    .glyphs .lbl { font: 10px "JetBrains Mono", monospace; opacity: .6; }
    .glyphs .k { font: 9px "JetBrains Mono", monospace; opacity: .55; text-align: center; }
    .glyphs .c { display: flex; justify-content: center; }
    .inline { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 14px; }
    .inline span { display: inline-flex; gap: 6px; align-items: center; }
    svg.thread { width: 100%; height: 60px; display: block; }
    canvas.plate { width: 320px; height: 180px; display: block; }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="pane dark" data-theme="dark"></section>
    <section class="pane light" data-theme="light"></section>
  </div>
  <script type="module" src="./preview.ts"></script>
</body>
</html>
