<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staffed cross-section: style mock-up (lab)</title>
  <script>
    (function () {
      var q = new URLSearchParams(location.search).get('theme');
      var t = q;
      try { if (!t) t = localStorage.getItem('drawn-theme'); } catch (e) {}
      document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Gelasio:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&family=Caveat:wght@500&display=swap" rel="stylesheet">
  <style>
    .dh { max-width: 1264px; margin: 0 auto; padding: 14px 32px 60px; position: relative; z-index: 1; }
    .dh-top { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-bottom: 12px; }
    .dh-top h1 { font: 700 18px/1.2 var(--serif); margin-right: auto; }
    .dh-ctl { display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: center; margin: 0 0 12px; }
    .seg { display: inline-flex; } .seg .btn + .btn { margin-left: -1px; }
    .seg .btn[aria-pressed="true"] { box-shadow: inset 0 -2px 0 var(--ink); }
    .stage { position: relative; width: 100%; max-width: 1200px; margin: 0 auto; background: var(--paper); border: 1px solid var(--edge); overflow: hidden; }
    .stage > svg { display: block; width: 100%; height: auto; }
    .stage .hand { position: absolute; color: var(--ink-2); line-height: 1.2; white-space: nowrap; }
    .dh-cap { max-width: 1200px; margin: 10px auto 0; font: 400 12px/1.5 var(--mono); color: var(--ink-2); }
    .dh-all { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .dh-all .stage { cursor: pointer; }
  </style>
</head>
<body>
  <div id="root"><div class="dh" id="dh"></div></div>
  <script type="module" src="/lab/dollhouse/main.ts"></script>
</body>
</html>
