<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paint bake-off (lab)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:#2A1E22;color:#F6EBDD;font-family:'Jost',sans-serif}
  #bar{display:flex;gap:6px;justify-content:center;align-items:center;padding:8px 0 6px;flex-wrap:wrap}
  #bar button,#bar input{font:500 13px 'Jost',sans-serif;letter-spacing:.07em;text-transform:uppercase;background:transparent;color:#F6EBDD;border:1.5px solid #8a7578;padding:5px 10px;border-radius:2px;cursor:pointer}
  #bar input{width:64px;text-align:center;cursor:text}
  #bar button b{color:#D9A441;margin-right:4px}
  #bar button.on{background:#F2C4CE;color:#3B2A2A;border-color:#F2C4CE}#bar button.on b{color:#3B2A2A}
  #stat{font-size:12px;letter-spacing:.05em;color:#cdb9b4;margin-left:10px}
  #app{display:flex;justify-content:center}
  .grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:min(1400px,calc(100vw - 20px))}
  .grid3{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;width:min(1880px,calc(100vw - 16px))}.grid3 .fig{grid-column:span 2;cursor:pointer}.grid3 .fig:nth-child(4){grid-column:2 / span 2}.grid3 .fig:nth-child(5){grid-column:4 / span 2}
  #bar .sep{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#a99;margin:0 2px 0 8px}
  .night .over text{filter:drop-shadow(0 0 5px #ffd890)}.over.glow text{filter:drop-shadow(0 0 2px #ffd890)}
  .fig{position:relative;margin:0}.fig .art{position:relative;width:100%}.fig canvas,.fig svg.a{display:block;width:100%;height:auto;filter:drop-shadow(0 8px 16px rgba(0,0,0,.45))}
  .fig svg.over{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .fig figcaption{font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:2px 2px 0;color:#e6d3cc}
  .full{width:min(calc(100vw - 16px),calc((100vh - 64px) * 1.6))}
</style>
</head>
<body><script>window.__errs=[];addEventListener('error',e=>__errs.push(e.message));addEventListener('unhandledrejection',e=>__errs.push(String(e.reason)));const ce=console.error;console.error=(...a)=>{__errs.push(a.map(String).join(' '));ce(...a)};</script><div id="bar"></div><div id="app"></div><script type="module" src="./main.ts"></script></body>
</html>
