<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Warehouse atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles/tokens.generated.css">
<link rel="stylesheet" href="./atlas.css">
</head>
<body>
<script>window.__errs=[];addEventListener('error',e=>__errs.push(e.message));addEventListener('unhandledrejection',e=>__errs.push(String(e.reason)));</script>
<header id="top">
  <div class="brand"><span class="mark" aria-hidden="true"></span><b>Warehouse atlas</b><span class="sub">NetSuite Analytics Warehouse · 25R4</span></div>
  <nav id="levels" aria-label="Zoom level"></nav>
  <div class="legend" aria-label="Line legend">
    <span><svg width="26" height="8"><line x1="1" y1="4" x2="25" y2="4" class="lg-solid"/></svg>stated in the data</span>
    <span><svg width="26" height="8"><line x1="1" y1="4" x2="25" y2="4" class="lg-dash"/></svg>inferred</span>
  </div>
</header>
<main id="main">
  <section id="stage" aria-label="Map">
    <svg id="map" role="img"></svg>
    <div id="crumb"></div>
  </section>
  <aside id="side">
    <div id="card" aria-live="polite"></div>
    <div id="dock">
      <div id="mini"><svg id="minisvg"></svg></div>
      <div id="zoom"><button data-z="in" title="Zoom in">+</button><button data-z="out" title="Zoom out">&minus;</button><button data-z="fit" title="Fit to screen" class="fit">Fit</button><span id="zpct"></span></div>
    </div>
  </aside>
</main>
<script type="module" src="./main.ts"></script>
</body>
</html>
